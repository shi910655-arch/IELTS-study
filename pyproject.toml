[project]
name = "ielts-study"
version = "0.1.0"
description = "Learn English for IELTS from any video or article: bilingual subtitles, phrase-by-phrase translation, dictation and spaced-repetition review, in 16 languages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "argostranslate>=1.11.0",
    "deno>=2.9.8",
    "en-core-web-sm",
    "imageio-ffmpeg>=0.8.1",
    # speech recognition: MLX on Apple Silicon, faster-whisper (CTranslate2) everywhere else
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # enhanced offline translation (Tencent HY-MT on the GPU, see local_mt.py): Apple Silicon only
    "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "opencc-python-reimplemented>=0.1.7",
    "spacy>=3.8.18",
    "yt-dlp[default]>=2026.10.26",
    "kokoro-onnx>=0.6.1",
    "segno>=1.6",
]

[project.scripts]
ielts-study = "ielts_study:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
