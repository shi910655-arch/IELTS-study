<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章精读</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="workspace">
  <aside class="workspace-nav"></aside>
  <main class="wrap article-wrap">
    <a class="back-link" href="/reading">← 文章列表</a>
    <header class="article-head">
      <h1 id="title">&nbsp;</h1>
      <p class="article-meta" id="meta"></p>
    </header>
    <div class="article-tools" role="toolbar" aria-label="阅读设置">
      <button type="button" class="btn" id="zhBtn" aria-pressed="false" title="逐句显示中文 (C)">中文对照</button>
      <button type="button" class="btn" id="marksBtn" aria-pressed="true" title="标出重点短语和难词 (M)">重点标注</button>
      <button type="button" class="btn" id="retranslate" title="用设置里的 API 模型重新翻译，并按单词和短语对照中文">↻ 重新翻译</button>
      <span class="hint">点单词查词、收藏；点句子末尾的「译」看这一句的中文。</span>
    </div>
    <div class="lang-notice" id="langNotice" hidden></div>
    <article class="article-body" id="body"></article>
  </main>
</div>
<div class="pop" id="pop"></div>
<script src="/static/common.js"></script>
<script>
const aid = decodeURIComponent(location.pathname.split("/").pop());
let data = null, cues = [];
let zhOn = storedFlag("readingZh");
let marksOn = readPreference("marks");

function render() {
  const paragraphs = [];
  for (const c of cues) (paragraphs[c.p] ||= []).push(c);
  const body = $("#body");
  body.classList.toggle("zh-on", zhOn);
  body.classList.toggle("no-marks", !marksOn);
  // 中文对照: each word or phrase gets its Chinese underneath (same layout as the video captions).
  const enHtml = c => {
    const marks = marksOn ? visibleMarks(c) : [];
    const layered = zhOn && interlinearFor(c, data.translator);
    return `<span class="sent-en${layered ? " interlinear" : ""}">${layered ? renderInterlinear(c.text, marks, c.gl, c.seg) : renderMarked(c.text, marks)}</span>`;
  };
  body.innerHTML = paragraphs.filter(Boolean).map(sents => `<div class="para">${sents.map(c => `
    <span class="sent" id="s${c.i}" data-i="${c.i}">${enHtml(c)}` +
      `<button type="button" class="sent-tr" data-tr="${c.i}" title="看这一句的中文">译</button>` + sentenceButton(c.text, c.i) +
      // one Chinese line only: when the phrases already carry their Chinese, skip the whole-sentence translation
      (zhOn && interlinearFor(c, data.translator) ? "" : `<span class="sent-zh"${zhLowAttrs(c)}>${esc(zhText(c))}</span>`) +
      `</span>`).join(" ")}</div>`).join("");
  $("#zhBtn").setAttribute("aria-pressed", zhOn);
  $("#zhBtn").classList.toggle("on", zhOn);
  $("#marksBtn").setAttribute("aria-pressed", marksOn);
  $("#marksBtn").classList.toggle("on", marksOn);
}

// ---------- word cards (shared code in common.js)
function toggleSave(btn) {
  const c = cues[+btn.dataset.cue];
  return toggleSaved(btn, c, { articleId: aid, sentenceIndex: c.i });
}

document.addEventListener("click", async e => {
  const sp = e.target.closest("[data-speak]");
  if (sp) { e.stopPropagation(); speak(sp.dataset.speak); return; }
  const sv = e.target.closest("[data-save]");
  if (sv) { e.stopPropagation(); return toggleSave(sv); }
  const ss = e.target.closest("[data-save-sent]");
  if (ss) {
    e.stopPropagation();
    const c = cues[+ss.dataset.saveSent];
    return toggleSentence(ss, { text: c.text, zh: c.zh, articleId: aid, sentenceIndex: c.i, title: data.title });
  }
  const tr = e.target.closest("[data-tr]");
  if (tr) {
    const c = cues[+tr.dataset.tr];
    showPop(tr, `<div class="note" style="border:0;padding:0"><div class="h"><span class="muted">第 ${c.i + 1} 句</span>
      <span class="act"><button class="iconbtn" data-speak="${esc(c.text)}" title="朗读这一句">🔊 朗读</button></span></div>
      <div class="zh"${zhLowAttrs(c)}>${esc(zhText(c) || "（没有译文）")}</div></div>`);
    return;
  }
  const word = e.target.closest(".article-body .w, .article-body mark");
  if (word) {
    return showWordCard(word, cues[+word.closest(".sent").dataset.i]);
  }
  if (!e.target.closest(".pop")) hidePop();
});

function showMeta() {
  const words = cues.reduce((n, c) => n + (c.text.match(/[A-Za-z][A-Za-z'’-]*/g) || []).length, 0);
  const marks = cues.reduce((n, c) => n + visibleMarks(c).length, 0);
  const aligned = cues.some(c => c.seg && c.seg.length);
  const how = translationLabel(data.translator, data.translatorModel, aligned);
  $("#meta").textContent = `${words} 词 · ${cues.length} 句 · ${marks} 处重点 · ${translationName(data.lang)}：${how}`;
  showLanguageNotice($("#langNotice"), data.lang, "这篇文章", retranslate);
}

// ---------- 重新翻译 with the API model (phrase by phrase)
async function retranslate() {
  const btn = $("#retranslate");
  if (!(await confirmRetranslate(cues.length, "这篇文章"))) return;
  btn.disabled = true;
  try {
    let job = await api(`/api/reading/${encodeURIComponent(aid)}/retranslate`, { method: "POST" });
    while (job.stage !== "done" && job.stage !== "error") {
      btn.textContent = job.stage === "queued" ? "排队中…" : `翻译中 ${Math.round(job.percent)}%`;
      await new Promise(r => setTimeout(r, 1000));
      job = await api(`/api/jobs/${job.id}`);
    }
    if (job.stage === "error") throw new Error(job.error || "重新翻译失败");
    data = await api(`/api/reading/${encodeURIComponent(aid)}`);
    cues = data.cues;
    showMeta();
    render();
    toast("已重新翻译");
  } catch (e) {
    alertDialog(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "↻ 重新翻译";
  }
}
$("#retranslate").onclick = retranslate;

// ---------- reading time for the daily plan: page visible and the reader active in the last 2 minutes
let lastActive = Date.now(), readPending = 0;
for (const type of ["scroll", "click", "keydown", "pointermove"]) addEventListener(type, () => { lastActive = Date.now(); }, { passive: true });
setInterval(() => {
  if (document.visibilityState === "visible" && Date.now() - lastActive < 120000) readPending += 15;
  if (readPending >= 60) { logStudyTime("read", readPending); readPending = 0; }
}, 15000);
addEventListener("pagehide", () => { if (readPending) logStudyTime("read", readPending, true); });

function setZh(on) { zhOn = on; storeFlag("readingZh", on); render(); }
$("#zhBtn").onclick = () => setZh(!zhOn);
$("#marksBtn").onclick = () => { marksOn = !marksOn; render(); };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea")) return;
  if (e.key === "c" || e.key === "C") setZh(!zhOn);
  if (e.key === "m" || e.key === "M") { marksOn = !marksOn; render(); }
  if (e.key === "Escape") hidePop();
});
window.addEventListener("profilechange", () => { if (cues.length) { render(); showMeta(); } });

(async () => {
  try { data = await api(`/api/reading/${encodeURIComponent(aid)}`); }
  catch { $("#body").innerHTML = `<p>找不到这篇文章。<a href="/reading">返回文章列表</a></p>`; return; }
  cues = data.cues;
  await loadLanguage();  // language names for the labels
  document.title = data.title;
  $("#title").textContent = data.title;
  showMeta();
  render();
  await loadSavedWords();
  const target = location.hash && document.getElementById(location.hash.slice(1));
  if (target) { target.scrollIntoView({ block: "center" }); target.classList.add("flash"); }
})();
</script>
</body>
</html>
